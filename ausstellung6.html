<!-- VIEWER -->
<img id="viewer" onclick="closeViewer()" alt="Vergrößerte Ansicht">

<script>
function toggleViewer(img) {
    const viewer = document.getElementById("viewer");

    if (viewer.style.display === "block" && viewer.src === img.src) {
        viewer.style.display = "none";
    } else {
        viewer.src = img.src;
        viewer.style.display = "block";
    }
}

function closeViewer() {
    document.getElementById("viewer").style.display = "none";
}
</script>
