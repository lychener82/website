<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Mein Portfolio</title>
  <style>
    body {
      margin: 0;
      font-family: Helvetica, Arial, sans-serif;
      background: #fff;
      color: #111;
      line-height: 1.5;
    }

    header {
      padding: 80px 20px;
      text-align: center;
    }

    h1 {
      font-size: 40px;
      margin: 0;
      letter-spacing: 1px;
    }

    p {
      max-width: 600px;
      margin: 10px auto;
      font-size: 16px;
      opacity: 0.8;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      padding: 40px;
    }

    .item {
      border: 1px solid #eee;
      padding: 10px;
    }

    .item img {
      width: 100%;
      height: auto;
      display: block;
    }

    footer {
      text-align: center;
      padding: 60px 20px;
      font-size: 14px;
      opacity: 0.6;
    }

    a {
      color: inherit;
    }
  </style>
</head>

<body>

  <header>
    <h1>Dein Name</h1>
    <p>Artist / Designer / Photographer – kurze Beschreibung wie bei minimalistischen Portfolio-Seiten</p>
  </header>

  <section class="grid">

    <div class="item">
      <img src="https://picsum.photos/600/400?1" />
      <p>Projekt 1</p>
    </div>

    <div class="item">
      <img src="https://picsum.photos/600/400?2" />
      <p>Projekt 2</p>
    </div>

    <div class="item">
      <img src="https://picsum.photos/600/400?3" />
      <p>Projekt 3</p>
    </div>

  </section>

  <footer>
    Kontakt: <a href="mailto:you@email.com">you@email.com</a>
  </footer>

</body>
</html>
